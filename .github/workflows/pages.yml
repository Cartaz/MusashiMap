name: Validate and deploy MusashiMap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate frontend
        run: node tools/validate-frontend.mjs

      - name: Validate narrative data
        run: node tools/validate-data.mjs

      - name: Validate research provenance
        run: node tools/validate-research-manifests.mjs

      - name: Validate independent source audits
        run: node tools/validate-source-audit.mjs

      - name: Run validator CLI tests
        run: node --test tools/tests/*.test.mjs

      - name: Run runtime safety tests
        run: node js/runtime-safety.test.mjs

      - name: Build spoiler-safe Pages artifact
        run: node tools/build-pages.mjs

      - name: Validate Pages artifact
        run: |
          node tools/validate-frontend.mjs --root _site
          node tools/validate-pages-artifact.mjs

      - name: Retain validated Pages files for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated Pages files
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
