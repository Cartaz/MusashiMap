name: Deploy MusashiMap to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate frontend
        run: node tools/validate-frontend.mjs

      - name: Validate narrative data
        run: node tools/validate-data.mjs

      - name: Validate staged books
        run: node tools/validate-staging.mjs

      - name: Run validator CLI tests
        run: node --test tools/tests/*.test.mjs

      - name: Run runtime safety tests
        run: node js/runtime-safety.test.mjs

      - name: Build spoiler-safe Pages artifact
        run: node tools/build-pages.mjs

      - name: Validate Pages artifact
        run: |
          node tools/validate-frontend.mjs --root _site
          node tools/validate-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
