name: Audit character names (temporary)

on:
  push:
    paths:
      - 'data/source/book1/**'
      - 'data/source/book2/**'
      - 'research/tools/audit-character-names.py'
      - '.github/workflows/audit-character-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate exhaustive candidate index
        run: python3 research/tools/audit-character-names.py > research/generated-character-name-candidates.md
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated-character-name-candidates.md
          git diff --cached --quiet && exit 0
          git commit -m 'research: generate exhaustive character-name candidate index'
          git push
