<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MusashiMap — mappa interattiva e senza spoiler di Musashi di Eiji Yoshikawa">
  <title>MusashiMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/vendor/leaflet-1.9.4/leaflet.css">
  <link rel="stylesheet" href="assets/vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-seal" aria-hidden="true">武</div>
        <div><h1>MusashiMap</h1></div>
      </div>
      <nav class="view-navigation" aria-label="Esplora il racconto" data-i18n-attr="aria-label:nav.explore">
        <button id="open-archive" type="button" disabled data-i18n="nav.archive">Archivio</button>
        <button id="open-relations" type="button" disabled data-i18n="nav.relations">Relazioni</button>
        <button id="language-toggle" type="button" lang="en" aria-label="Switch to English" data-i18n="language.switch" data-i18n-attr="aria-label:language.switchLabel">EN</button>
      </nav>
      <div class="section-navigation" aria-label="Navigazione della storia" data-i18n-attr="aria-label:nav.story">
        <span class="nav-caption" data-i18n="nav.reading">LETTURA</span>
        <button id="prev-section" type="button" aria-label="Sezione precedente" data-i18n-attr="aria-label:nav.previous">‹</button>
        <select id="section-select" aria-label="Seleziona sezione" data-i18n-attr="aria-label:nav.select"></select>
        <button id="next-section" type="button" aria-label="Sezione successiva" data-i18n-attr="aria-label:nav.next">›</button>
        <div class="chapter-jump">
          <label for="chapter" data-i18n="nav.section">Sezione</label>
          <input id="chapter" type="number" min="1" value="1" inputmode="numeric">
          <button id="chapter-apply" type="button" data-i18n="nav.go">Vai</button>
        </div>
      </div>
    </header>
    <section class="map-stage" aria-label="Mappa geografica" data-i18n-attr="aria-label:map.stage">
      <div id="map" class="map" aria-label="Mappa interattiva del viaggio narrativo" data-i18n-attr="aria-label:map.interactive"></div>
      <div id="map-unmapped" class="map-unmapped" hidden aria-live="polite"></div>
      <div class="map-overlay">
        <p id="book-label" class="placeholder-kicker"></p>
        <h2 id="section-title"></h2>
        <p id="map-note" hidden></p>
      </div>
      <section class="map-legend panel-parchment pergamena-chiusa pergamena-chiusa--verticale is-collapsed" aria-label="Legenda della mappa" data-i18n-attr="aria-label:legend.label">
        <button class="legend-heading" type="button" aria-controls="place-legend" aria-expanded="false" aria-label="Apri legenda"><span class="panel-kicker" data-i18n="legend.title">Legenda</span></button>
        <div id="place-legend" class="legend-items"></div>
      </section>
      <section class="character-panel map-character-panel panel-parchment pergamena-chiusa pergamena-chiusa--orizzontale is-collapsed" aria-label="Tracce narrative" data-i18n-attr="aria-label:tracks.label">
        <div class="panel-heading">
          <button id="character-toggle" class="character-panel-toggle" type="button" aria-controls="character-filter-body" aria-expanded="false" aria-label="Apri tracce narrative"><span class="panel-kicker" data-i18n="tracks.title">TRACCE NARRATIVE</span></button>
          <div class="filter-actions">
            <button id="select-all" type="button" data-i18n="tracks.all">Tutti</button>
            <button id="select-none" type="button" data-i18n="tracks.none">Nessuno</button>
          </div>
        </div>
        <div id="character-filter-body" class="character-filter-body">
          <div id="character-filters" class="character-filters"></div>
          <div id="character-list" class="character-grid"></div>
        </div>
      </section>
    </section>
    <aside class="info-panel panel-parchment pergamena-chiusa pergamena-chiusa--verticale is-collapsed" aria-label="Il diario del viaggio" data-i18n-attr="aria-label:diary.label">
      <button class="sidebar-masthead diary-toggle" type="button" aria-controls="diary-content" aria-expanded="false" aria-label="Apri il diario del viaggio"><span class="sidebar-rule"></span><span class="diary-collapsed-label" data-i18n="diary.title" data-close-label="Chiudi" data-i18n-attr="data-close-label:diary.closeShort">IL DIARIO DEL VIAGGIO</span></button>
      <div id="diary-content" class="diary-content">
        <h2 data-i18n="diary.status">Stato della lettura</h2>
        <p id="status" data-i18n="diary.loading">Caricamento…</p>
        <p id="data-status" class="data-status" data-i18n="diary.loadingData">Caricamento dati…</p>
        <nav class="diary-navigation" aria-label="Contenuto del diario" data-i18n-attr="aria-label:diary.contents">
          <button id="diary-chapter-button" type="button" aria-pressed="true" aria-controls="diary-chapter" data-i18n="diary.chapter">Capitolo</button>
          <button id="diary-context-button" type="button" aria-pressed="false" aria-controls="diary-context" data-i18n="diary.context">Contesto</button>
        </nav>
        <section id="diary-chapter" class="sidebar-section">
          <h2 data-i18n="diary.meanwhile">Nel frattempo</h2>
          <label class="event-scope-label" for="event-scope" data-i18n="diary.eventScope">Eventi da mostrare</label>
          <select id="event-scope">
            <option value="all" data-i18n="diary.eventScopeAll">Tutti gli eventi del capitolo</option>
            <option value="selected" data-i18n="diary.eventScopeSelected">Solo le tracce selezionate</option>
          </select>
          <ul id="event-list"></ul>
        </section>
        <section id="diary-context" class="sidebar-section" aria-labelledby="wiki-title" hidden>
          <div class="sidebar-heading">
            <div>
              <p class="panel-kicker" data-i18n="diary.contextKicker">CONTESTO</p>
              <h2 id="wiki-title" data-i18n="diary.context">Contesto</h2>
              <p data-i18n="diary.contextIntro">Personaggi secondari e riferimenti storici già incontrati nella lettura.</p>
            </div>
          </div>
          <div id="wiki-list" class="wiki-list"></div>
        </section>
      </div>
    </aside>
  </main>

  <dialog id="explorer-dialog" class="explorer-dialog panel-parchment" aria-labelledby="explorer-title">
    <header class="explorer-header">
      <div>
        <p class="panel-kicker" data-i18n="explorer.kicker">IL RACCONTO, UN CAPITOLO ALLA VOLTA</p>
        <h1 id="explorer-title">Archivio del viaggio</h1>
      </div>
      <button id="explorer-close" class="explorer-button" type="button" data-i18n="explorer.back">← Torna alla mappa</button>
    </header>
    <div class="explorer-toolbar">
      <nav class="explorer-navigation" aria-label="Vista di approfondimento" data-i18n-attr="aria-label:explorer.view">
        <button type="button" data-explorer-view="archive" aria-pressed="true" data-i18n="nav.archive">Archivio</button>
        <button type="button" data-explorer-view="relations" aria-pressed="false" data-i18n="nav.relations">Relazioni</button>
      </nav>
      <p id="explorer-boundary" class="explorer-boundary"></p>
    </div>
    <section id="archive-panel" class="archive-panel" aria-label="Catalogo e cronologia" data-i18n-attr="aria-label:explorer.catalog">
      <div class="archive-controls">
        <label for="archive-search" data-i18n="explorer.search">Cerca nelle informazioni già incontrate</label>
        <input id="archive-search" type="search" placeholder="Un nome, un luogo, un evento…" autocomplete="off" data-i18n-attr="placeholder:explorer.searchPlaceholder">
        <nav id="archive-categories" class="explorer-navigation" aria-label="Categorie dell’archivio" data-i18n-attr="aria-label:explorer.categories">
          <button type="button" data-category="characters" aria-pressed="true" data-i18n="explorer.characters">Personaggi</button>
          <button type="button" data-category="places" aria-pressed="false" data-i18n="explorer.places">Luoghi</button>
          <button type="button" data-category="events" aria-pressed="false" data-i18n="explorer.events">Eventi</button>
          <button type="button" data-category="timeline" aria-pressed="false" data-i18n="explorer.timeline">Cronologia</button>
        </nav>
        <p id="archive-count" class="explorer-count" role="status"></p>
      </div>
      <div class="archive-columns">
        <div class="archive-list-pane">
          <div id="archive-results" class="archive-results"></div>
          <nav class="explorer-pagination" aria-label="Pagine dei risultati" data-i18n-attr="aria-label:explorer.resultPages">
            <button id="archive-prev" type="button" data-i18n="explorer.previous">← Prima</button>
            <span id="archive-page-label"></span>
            <button id="archive-next" type="button" data-i18n="explorer.next">Dopo →</button>
          </nav>
        </div>
        <article id="archive-detail" class="archive-detail" aria-label="Scheda di approfondimento" data-i18n-attr="aria-label:explorer.detail"></article>
      </div>
    </section>
    <section id="relations-panel" class="relations-panel" aria-label="Legami tra personaggi" data-i18n-attr="aria-label:explorer.relationsLabel" hidden>
      <div class="relations-controls">
        <label><span data-i18n="explorer.relationSearch">Cerca un personaggio</span><input id="relation-search" type="search" autocomplete="off"></label>
        <label><span data-i18n="explorer.relationCharacter">Personaggio da esplorare</span><select id="relation-character"></select></label>
        <label><span data-i18n="explorer.relationType">Tipo di legame</span><select id="relation-type"></select></label>
      </div>
      <nav class="explorer-navigation" aria-label="Presentazione delle relazioni" data-i18n-attr="aria-label:explorer.relationMode">
        <button type="button" data-relation-mode="list" aria-pressed="true" data-i18n="explorer.list">Elenco</button>
        <button type="button" data-relation-mode="graph" aria-pressed="false" data-i18n="explorer.graph">Grafo</button>
      </nav>
      <p id="relations-note" class="explorer-boundary"></p>
      <div id="relation-results" class="relation-results"></div>
      <section id="graph-panel" hidden aria-label="Grafo dei legami" data-i18n-attr="aria-label:explorer.graphLabel">
        <div id="relation-graph" class="relation-graph"></div>
        <nav class="explorer-pagination" aria-label="Pagine dei collegamenti" data-i18n-attr="aria-label:explorer.graphPages">
          <button id="graph-prev" type="button" data-i18n="explorer.previous">← Prima</button>
          <span id="graph-page-label"></span>
          <button id="graph-next" type="button" data-i18n="explorer.next">Dopo →</button>
        </nav>
      </section>
    </section>
  </dialog>
  <script src="assets/vendor/leaflet-1.9.4/leaflet.js"></script>
  <script src="assets/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <script type="module" src="js/language-boot.js"></script>
  <script type="module" src="js/panel-toggle.js"></script>
  <script type="module" src="js/map-runtime.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
