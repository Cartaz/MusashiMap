<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MusashiMap — mappa interattiva e senza spoiler di Musashi di Eiji Yoshikawa">
  <title>MusashiMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div class="brand-lockup"><div class="brand-seal" aria-hidden="true">武</div><div><h1>MusashiMap</h1></div></div><nav class="view-navigation" aria-label="Esplora il racconto"><button id="open-archive" type="button" disabled>Archivio</button><button id="open-relations" type="button" disabled>Relazioni</button></nav><div class="section-navigation" aria-label="Navigazione della storia"><span class="nav-caption">LETTURA</span><button id="prev-section" type="button" aria-label="Sezione precedente">‹</button><select id="section-select" aria-label="Seleziona sezione"></select><button id="next-section" type="button" aria-label="Sezione successiva">›</button><div class="chapter-jump"><label for="chapter">Sezione</label><input id="chapter" type="number" min="1" value="1" inputmode="numeric"><button id="chapter-apply" type="button">Vai</button></div></div></header><section class="map-stage" aria-label="Mappa geografica"><div id="map" class="map" aria-label="Mappa interattiva del viaggio narrativo"></div><div id="map-unmapped" class="map-unmapped" hidden aria-live="polite"></div><div class="map-overlay"><p id="book-label" class="placeholder-kicker">Earth</p><h2 id="section-title">The Little Bell</h2><p id="map-note" hidden></p></div><section class="map-legend panel-parchment pergamena-chiusa pergamena-chiusa--verticale is-collapsed" aria-label="Legenda della mappa"><button class="legend-heading" type="button" aria-controls="place-legend" aria-expanded="false" aria-label="Apri legenda"><span class="panel-kicker">Legenda</span></button><div id="place-legend" class="legend-items"></div></section><section class="character-panel map-character-panel panel-parchment pergamena-chiusa pergamena-chiusa--orizzontale is-collapsed" aria-label="Tracce narrative"><div class="panel-heading"><button id="character-toggle" class="character-panel-toggle" type="button" aria-controls="character-filter-body" aria-expanded="false" aria-label="Apri tracce narrative"><span class="panel-kicker">TRACCE NARRATIVE</span></button><div class="filter-actions"><button id="select-all" type="button">Tutti</button><button id="select-none" type="button">Nessuno</button></div></div><div id="character-filter-body" class="character-filter-body"><div id="character-filters" class="character-filters"></div><div id="character-list" class="character-grid"></div></div></section></section><aside class="info-panel panel-parchment pergamena-chiusa pergamena-chiusa--verticale is-collapsed" aria-label="Il diario del viaggio"><button class="sidebar-masthead diary-toggle" type="button" aria-controls="diary-content" aria-expanded="false" aria-label="Apri il diario del viaggio"><span class="sidebar-rule"></span><span class="diary-collapsed-label">IL DIARIO DEL VIAGGIO</span></button><div id="diary-content" class="diary-content"><h2>Stato della lettura</h2><p id="status">Caricamento…</p><p id="data-status" class="data-status">Caricamento dati…</p><nav class="diary-navigation" aria-label="Contenuto del diario"><button id="diary-chapter-button" type="button" aria-pressed="true" aria-controls="diary-chapter">Capitolo</button><button id="diary-context-button" type="button" aria-pressed="false" aria-controls="diary-context">Contesto</button></nav><section id="diary-chapter" class="sidebar-section"><h2>Nel frattempo</h2><label class="event-scope-label" for="event-scope">Eventi da mostrare</label><select id="event-scope"><option value="all">Tutti gli eventi del capitolo</option><option value="selected">Solo le tracce selezionate</option></select><ul id="event-list"></ul></section><section id="diary-context" class="sidebar-section" aria-labelledby="wiki-title" hidden><div class="sidebar-heading"><div><p class="panel-kicker">CONTESTO</p><h2 id="wiki-title">Contesto</h2><p>Personaggi secondari e riferimenti storici già incontrati nella lettura.</p></div></div><div id="wiki-list" class="wiki-list"></div></section></div></aside>
  </main>

  <dialog id="explorer-dialog" class="explorer-dialog panel-parchment" aria-labelledby="explorer-title">
    <header class="explorer-header">
      <div><p class="panel-kicker">IL RACCONTO, UN CAPITOLO ALLA VOLTA</p><h1 id="explorer-title">Archivio del viaggio</h1></div>
      <button id="explorer-close" class="explorer-button" type="button">← Torna alla mappa</button>
    </header>
    <div class="explorer-toolbar">
      <nav class="explorer-navigation" aria-label="Vista di approfondimento"><button type="button" data-explorer-view="archive" aria-pressed="true">Archivio</button><button type="button" data-explorer-view="relations" aria-pressed="false">Relazioni</button></nav>
      <p id="explorer-boundary" class="explorer-boundary"></p>
    </div>
    <section id="archive-panel" class="archive-panel" aria-label="Catalogo e cronologia">
      <div class="archive-controls">
        <label for="archive-search">Cerca nelle informazioni già incontrate</label><input id="archive-search" type="search" placeholder="Un nome, un luogo, un evento…" autocomplete="off">
        <nav id="archive-categories" class="explorer-navigation" aria-label="Categorie dell’archivio"><button type="button" data-category="characters" aria-pressed="true">Personaggi</button><button type="button" data-category="places" aria-pressed="false">Luoghi</button><button type="button" data-category="events" aria-pressed="false">Eventi</button><button type="button" data-category="timeline" aria-pressed="false">Cronologia</button></nav>
        <p id="archive-count" class="explorer-count" role="status"></p>
      </div>
      <div class="archive-columns">
        <div class="archive-list-pane"><div id="archive-results" class="archive-results"></div><nav class="explorer-pagination" aria-label="Pagine dei risultati"><button id="archive-prev" type="button">← Prima</button><span id="archive-page-label"></span><button id="archive-next" type="button">Dopo →</button></nav></div>
        <article id="archive-detail" class="archive-detail" aria-label="Scheda di approfondimento"></article>
      </div>
    </section>
    <section id="relations-panel" class="relations-panel" aria-label="Legami tra personaggi" hidden>
      <div class="relations-controls"><label>Cerca un personaggio<input id="relation-search" type="search" autocomplete="off"></label><label>Personaggio da esplorare<select id="relation-character"></select></label><label>Tipo di legame<select id="relation-type"></select></label></div>
      <nav class="explorer-navigation" aria-label="Presentazione delle relazioni"><button type="button" data-relation-mode="list" aria-pressed="true">Elenco</button><button type="button" data-relation-mode="graph" aria-pressed="false">Grafo</button></nav>
      <p id="relations-note" class="explorer-boundary"></p>
      <div id="relation-results" class="relation-results"></div>
      <section id="graph-panel" hidden aria-label="Grafo dei legami"><div id="relation-graph" class="relation-graph"></div><nav class="explorer-pagination" aria-label="Pagine dei collegamenti"><button id="graph-prev" type="button">← Prima</button><span id="graph-page-label"></span><button id="graph-next" type="button">Dopo →</button></nav></section>
    </section>
  </dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script type="module" src="js/panel-toggle.js"></script><script type="module" src="js/map-runtime.js"></script><script type="module" src="js/app.js"></script>
</body>
</html>
